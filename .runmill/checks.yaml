# Checks runmill must run before a change can be merge-ready.
#
# A check with no `report` is executed but its coverage cannot be proven, so it
# shows as `unproven` and cannot satisfy a required gate while
# verification.fail_on_skipped_check is true. A declared report must be newly
# generated by the check and parse as junit, tap, or go-json. Runmill
# pre-creates that exact file as the only writable checkout path, so the
# reporter must overwrite it.
checks:
  - id: typecheck
    run: npm run typecheck

  - id: test
    run: npm test
    # report:
    #   path: junit.xml
    #   format: junit

# A report-producing check may declare an exact test id under that check:
#   declared_skips:
#     - test_id: "package::test name"
#       cause: "requires staging; tracked in ENG-88"
# A declaration is scoped to that check and never authorizes a skip by count.
