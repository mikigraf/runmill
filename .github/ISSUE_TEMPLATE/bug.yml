name: Bug report
description: Something did not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Run `runmill doctor --report` and paste the bundle below. It contains no
        credentials, no source, and no absolute paths.
  - type: textarea
    id: bundle
    attributes:
      label: Support bundle
      description: Output of `runmill doctor --report`. If Runmill cannot start, explain that here.
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the Runmill and Node versions, operating system, and sandbox mechanism.
      placeholder: runmill <version> / Node 22 / macOS 15 / Seatbelt
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: runmill run ENG-123
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed tokens, provider keys, private source, and unredacted agent output.
          required: true
