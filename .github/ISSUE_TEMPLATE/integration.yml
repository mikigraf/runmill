name: Integration or compatibility report
description: Report setup, provider, forge, backlog, sandbox, or platform behavior
labels: [integration]
body:
  - type: dropdown
    id: integration
    attributes:
      label: Integration
      options:
        - Codex
        - Claude Code
        - GitHub
        - Linear
        - macOS Seatbelt
        - Linux bubblewrap
        - OpenTUI
        - Other
    validations:
      required: true
  - type: input
    id: runmill-version
    attributes:
      label: Runmill version or commit
      placeholder: version or git SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15 / Node 24 / Codex CLI 1.x
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Doctor output
      description: Paste the relevant redacted output. Never include credentials.
      render: text
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed tokens, provider keys, private source, and unredacted agent output.
          required: true
