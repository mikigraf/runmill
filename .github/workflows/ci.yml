name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Generated documentation is current
        run: npm run docs:check

  native-transport:
    name: Linux native ctxlane transport
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - name: Install the native transport fixture runtime
        run: sudo apt-get update && sudo apt-get install -y python3
      - name: Build the Linux native transport artifact
        run: npm run build:native
      - name: Require a non-empty architecture-matched addon
        run: test -s "dist-native/linux-$(node -p 'process.arch')/ctxlane-seqpacket.node"
      - name: Run native transport boundary tests
        run: npx vitest run test/identity/ctxlane-native-transport.test.ts

  test:
    name: test (Node ${{ matrix.node }}, ${{ matrix.os }})
    # Both platforms are first-class execution targets and their sandbox
    # mechanisms differ. Both supported LTS lines exercise the full suite.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.15.0
      - run: npm ci

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # Ubuntu runners restrict unprivileged user namespaces by default, while
      # bubblewrap needs one for every sandbox. Prove the mechanism is usable
      # before running tests so containment cannot silently degrade.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true
          bwrap --dev-bind / / true \
            || { echo "::error::bubblewrap cannot create a user namespace on this runner"; exit 1; }

      - run: npm run test:coverage

  node-current-canary:
    name: Node 26 canary (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - name: Install and prove bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true
          bwrap --dev-bind / / true
      - run: npm run test:coverage

  package:
    name: package smoke (${{ matrix.os }})
    needs: [quality, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - name: Pack, install, and execute the published CLI
        run: npm run package:check
