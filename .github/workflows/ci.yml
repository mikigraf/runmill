name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both are first-class execution targets and their sandbox mechanisms
    # differ, so a green macOS run says nothing about Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # Ubuntu 23.10 and later block unprivileged user namespaces with an
      # AppArmor profile, and bubblewrap needs one for every sandbox it builds.
      # Without this the runner has a bwrap binary that cannot create a
      # namespace, so `Sandbox.run` exits 1 and the Linux half of the matrix
      # fails on the mechanism rather than on anything runmill did. Proven
      # rather than assumed, because a runner that silently could not sandbox
      # would make every enforcement test below pass for the wrong reason.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true
          bwrap --dev-bind / / true \
            || { echo "::error::bubblewrap cannot create a user namespace on this runner"; exit 1; }

      - run: npm run typecheck
      # Coverage thresholds live in vitest.config.ts. Without this step they
      # were configured but never enforced, so they could drift downward
      # indefinitely without anything failing.
      - run: npm run test:coverage

      - name: Error reference is current
        run: npm run docs:check

      - name: Package contains the binary it declares
        run: |
          npm pack --pack-destination /tmp >/dev/null
          tar tzf /tmp/runmill-*.tgz | grep -q 'package/dist/cli/main.js' \
            || { echo "::error::bin target missing from the published package"; exit 1; }
