name: publish npm release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'mikigraf/runmill'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use the pinned trusted-publishing npm CLI
        run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm run check
      - run: npm run package:check
      - name: Bind the release tag to package.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node -e
          'const [tag, version] = process.argv.slice(1);
          if (tag !== `v${version}`) throw new Error(`release tag ${tag} does not match package ${version}`)'
          "$RELEASE_TAG" "$(node -p 'require("./package.json").version')"
      - name: Publish through npm trusted publishing
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --access public --tag next
          else
            npm publish --access public --tag latest
          fi
