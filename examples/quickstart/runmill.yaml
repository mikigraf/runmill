# yaml-language-server: $schema=https://raw.githubusercontent.com/mikigraf/runmill/main/runmill.schema.json
version: 1
autonomy: pr-only

providers:
  implementer:
    implementation: codex
  reviewer:
    implementation: inherit

backlog:
  provider: linear
  team: ENG
  eligible_states: [Todo, Ready]
  claim_state: In Progress
  completed_state: Done
  delivered_state: In Review
  include_labels: [agent-ready]
  exclude_labels: [needs-design, no-agent]
  max_estimate: 5

github:
  repositories:
    - match: { team: ENG }
      repo: acme/platform
      base_branch: main

# This fixture has no application or test framework. A real `runmill init`
# infers locked npm scripts or blocks until the operator declares real checks.
verification:
  commands:
    - id: diff-check
      run: git diff --check
